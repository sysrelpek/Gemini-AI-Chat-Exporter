<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #f9f9f9;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #444;
    }
    select {
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    button {
      padding: 8px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background-color 0.2s;
    }
    #exportFile { background-color: #1a73e8; }
    #exportFile:hover { background-color: #1557b0; }
    #copyClip { background-color: #34a853; }
    #copyClip:hover { background-color: #2d8b44; }
  </style>
  <title>GemAI Chat Exporter</title>
</head>
<body>
  <label for="formatSelect">Choose Format:</label>
  <select id="formatSelect">
    <option value="activity_html">Official HTML Style (.html)</option>
    <option value="md">Markdown (.md)</option>
    <option value="txt">Plain Text (.txt)</option>
    <option value="json">Structured JSON (.json)</option>
  </select>

  <hr style="border: 0; border-top: 1px solid #ddd; margin: 4px 0;">

  <button id="exportFile">Download File</button>
  <button id="copyClip">Copy to Clipboard</button>

  <script src="popup.js"></script>
</body>
</html>
